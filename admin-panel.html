<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WASA Kasur | AI Developer Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fira+Code&display=swap" rel="stylesheet" />
  
  <!-- Firebase & Libraries -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBSf45vEBv_PqEnA4jEKUfGcZvLcru-3rU",
      authDomain: "wasa-app-ksr.firebaseapp.com",
      projectId: "wasa-app-ksr",
      storageBucket: "wasa-app-ksr.firebasestorage.app",
      messagingSenderId: "572534729136",
      appId: "1:572534729136:web:c172481da5a37756c50e75",
      measurementId: "G-363L5VJD0R"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.WASA = { app, auth, db, firebase: { collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, serverTimestamp, signInWithEmailAndPassword, signOut, onAuthStateChanged } };
    window.dispatchEvent(new Event('wasa-ready'));
  </script>

  <style>
    :root { --primary: #1A56DB; --sidebar-bg: #0B1220; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-800: #1F2937; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #F9FAFB; display: flex; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR */
    #sidebar { width: 260px; background: var(--sidebar-bg); color: #94A3B8; display: flex; flex-direction: column; }
    .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .nav-item:hover, .nav-item.active { background: #1E293B; color: white; }
    .nav-item.active { border-left: 4px solid var(--primary); background: var(--primary); }

    /* MAIN CONTENT */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header { height: 60px; background: white; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; padding: 0 20px; font-weight: 700; }
    .content-body { flex: 1; padding: 20px; overflow-y: auto; }
    
    /* AI CHAT INTERFACE */
    .ai-container { display: flex; flex-direction: column; height: 100%; background: white; border-radius: 12px; border: 1px solid var(--gray-200); overflow: hidden; }
    .ai-header { padding: 15px 20px; background: #0F172A; color: white; display: flex; justify-content: space-between; font-size: 14px; }
    .ai-stream { flex: 1; padding: 20px; overflow-y: auto; background: #F8FAFC; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .msg-user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
    .msg-ai { align-self: flex-start; background: white; border: 1px solid var(--gray-200); color: var(--gray-800); border-bottom-left-radius: 2px; }
    
    .code-btn { margin-top: 10px; background: #10B981; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; display: block; }
    
    .ai-input-area { padding: 15px; background: white; border-top: 1px solid var(--gray-200); display: flex; gap: 10px; }
    .ai-input { flex: 1; padding: 12px; border: 1px solid var(--gray-300); border-radius: 8px; outline: none; }
    .ai-send { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: white; width: 90%; max-width: 800px; border-radius: 12px; padding: 20px; overflow: hidden; }
    iframe { width: 100%; height: 400px; border: 1px solid var(--gray-200); margin-top: 15px; border-radius: 8px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<aside id="sidebar">
  <div style="padding: 20px; color: white; font-weight: 800; border-bottom: 1px solid #1E293B;">WASA Kasur</div>
  <div class="nav-item" onclick="location.reload()">📊 Dashboard</div>
  <div class="nav-item" onclick="alert('Consumers Loaded')">👥 Consumers</div>
  <div style="margin-top:auto; padding: 20px; font-size: 10px; opacity: 0.5;">v2.8.1.0 • Nafees</div>
</aside>

<div id="main">
  <header>🤖 WASA AI Studio</header>
  
  <div class="content-body">
    <div class="ai-container">
      <div class="ai-header">
        <span>Model: Moonshot Kimi-K3 (NVIDIA)</span>
        <input type="password" id="apiKey" placeholder="Paste API Key here..." style="background:#1E293B; border:none; color:white; padding:4px 10px; border-radius:4px; font-size:11px; width:200px;">
      </div>
      
      <div class="ai-stream" id="aiStream">
        <div class="msg msg-ai">Assalam-o-Alaikum! Main WASA AI hoon. Aap mujhse koi bhi sawal pooch sakte hain ya app mein changes karwa sakte hain.</div>
      </div>
      
      <div class="ai-input-area">
        <input type="text" class="ai-input" id="aiInput" placeholder="Sawal poochein ya code change batayein..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="ai-send" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 id="previewTitle">AI Code Preview</h3>
      <button onclick="document.getElementById('previewModal').style.display='none'" style="cursor:pointer; border:none; background:none; font-size:20px;">✕</button>
    </div>
    <iframe id="previewFrame"></iframe>
    <div style="margin-top: 15px; display:flex; justify-content:flex-end; gap:10px;">
      <button onclick="document.getElementById('previewModal').style.display='none'" style="padding:8px 16px; border-radius:6px; border:1px solid #ccc; cursor:pointer;">Discard</button>
      <button onclick="alert('Changes Applied!')" style="background:#10B981; color:white; padding:8px 16px; border-radius:6px; border:none; cursor:pointer; font-weight:700;">Apply to Live System</button>
    </div>
  </div>
</div>

<script>
  let generatedCode = "";

  async function sendMessage() {
    const input = document.getElementById('aiInput');
    const stream = document.getElementById('aiStream');
    const key = document.getElementById('apiKey').value.trim();
    const prompt = input.value.trim();
    
    if(!prompt) return;
    if(!key) { alert("Pehle API Key paste karein!"); return; }

    // Add user message
    stream.innerHTML += `<div class="msg msg-user">${prompt}</div>`;
    input.value = "";
    stream.scrollTop = stream.scrollHeight;

    // Add loading
    const loading = document.createElement('div');
    loading.className = "msg msg-ai";
    loading.innerHTML = "Thinking...";
    stream.appendChild(loading);

    try {
      const response = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${key}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "moonshotai/kimi-k3",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.7,
          max_tokens: 1024
        })
      });

      const data = await response.json();
      const reply = data.choices[0].message.content;
      
      // Clean loading
      loading.innerHTML = reply.replace(/\n/g, "<br>");
      
      // Check if reply has CODE blocks
      const codeMatch = reply.match(/```(?:html|javascript|css)?\n([\s\S]*?)```/);
      if(codeMatch) {
        generatedCode = codeMatch[1];
        const btn = document.createElement('button');
        btn.className = "code-btn";
        btn.innerHTML = "▶️ Launch Live Preview";
        btn.onclick = () => openPreview(generatedCode);
        loading.appendChild(btn);
      }
      
      stream.scrollTop = stream.scrollHeight;
    } catch (e) {
      loading.innerHTML = "Error: " + e.message;
    }
  }

  function openPreview(code) {
    const modal = document.getElementById('previewModal');
    const frame = document.getElementById('previewFrame');
    modal.style.display = 'flex';
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open();
    doc.write(code.includes('<html') ? code : `<html><body style="font-family:sans-serif; padding:20px;">${code}</body></html>`);
    doc.close();
  }
</script>
</body>
</html>
